[project]
name = "calorie-agent"
version = "0.1.0"
description = "Self-hosted, bring-your-own-key calorie & macro tracking agent for Telegram, built with LangChain + LangGraph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["telegram-bot", "calorie-tracker", "langchain", "langgraph", "nutrition", "llm-agent"]
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "langchain>=1.0",
    "langgraph>=1.0",
    "pydantic-settings>=2.4",
    "python-telegram-bot[job-queue]>=21",
    "sqlmodel>=0.0.22",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
google = ["langchain-google-genai>=2.0"]
groq = ["langchain-groq>=0.2"]
ollama = ["langchain-ollama>=0.2"]
postgres = ["psycopg[binary]>=3.2"]
all = ["calorie-agent[openai,anthropic,google,groq,ollama,postgres]"]

[project.scripts]
calorie-agent = "calorie_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: LLM evals that call a real model (need an API key)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
